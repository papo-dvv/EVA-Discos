services:
  postgres:
    image: postgres:16
    container_name: eva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456789"
      POSTGRES_DB: eva
    ports:
      - "5432:5432"
    volumes:
      - eva-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eva"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: eva-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:123456789@postgres:5432/eva?schema=public
      JWT_SECRET: local-development-secret-change-before-production
      JWT_EXPIRES_IN: 8h
      WEB_ORIGIN: http://localhost:5173
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  eva-postgres-data:
